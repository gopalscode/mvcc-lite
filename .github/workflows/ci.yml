name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Ordinary build + the full 98-test suite, on both Linux and macOS.
  # This is the baseline check: does it build cleanly and do the tests
  # actually pass, on two different platforms/compilers/toolchains.
  test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build -j 4

      - name: Run test suite
        run: ctest --test-dir build --output-on-failure

  # The same suite again, but compiled with ThreadSanitizer and run
  # under it. This is the check that actually matters most for a
  # concurrency-heavy project like this one: a test can pass while the
  # code underneath it has a real data race that just didn't happen to
  # manifest on that particular run.
  #
  # Linux only, deliberately, and only after real investigation: a
  # trivial 5-line program with zero connection to this codebase
  # (spawn a thread, increment an int, join) segfaults under
  # -fsanitize=thread on macOS/arm64 with the current AppleClang
  # toolchain. Two documented, real fixes for known TSan-on-macOS
  # issues were tried directly against that reproduction and neither
  # resolved it: disabling the malloc nano zone (MallocNanoZone=0),
  # and ad-hoc codesigning the binary with the get-task-allow
  # entitlement Apple Silicon requires for certain runtime
  # instrumentation. This matches a long-standing, still-open category
  # of TSan/macOS/arm64 compatibility issue reported upstream over
  # several years with no universal fix. Given that, ThreadSanitizer
  # verification runs here on Linux, where it's stable and where every
  # phase of this project was actually developed and verified; the
  # plain (non-sanitized) test suite above still covers macOS for
  # ordinary correctness.
  #
  # Benchmarks are excluded here (MVCC_BUILD_BENCHMARKS=OFF): the
  # benchmark is a standalone throughput-measurement tool, not a
  # correctness test, and running it under a sanitizer's instrumentation
  # overhead would only produce meaningless timing numbers while adding
  # build time for no verification value.
  thread-sanitizer:
    name: ThreadSanitizer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Configure with ThreadSanitizer
        run: >
          cmake -S . -B build-tsan
          -DMVCC_SANITIZE=thread
          -DCMAKE_BUILD_TYPE=Debug
          -DMVCC_BUILD_BENCHMARKS=OFF

      - name: Build
        run: cmake --build build-tsan -j 4

      - name: Run test suite under ThreadSanitizer
        run: ctest --test-dir build-tsan --output-on-failure
      